<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 350" fill="currentColor">
  <!-- Kyai Semar Silhouette -->
  <!-- Body, Head with Kuncung, and Round Belly -->
  <path d="M110,60 
           C110,40 125,30 135,30 
           C140,20 145,15 155,15 
           C150,25 152,35 145,45 
           C155,50 160,65 150,80 
           C170,90 190,120 190,160 
           C190,210 160,260 120,270 
           L120,300 L90,300 L90,270 
           C50,265 40,220 40,170 
           C40,120 70,85 100,75 
           C95,70 100,60 110,60 Z" />

  <!-- Pointing Hand & Arm -->
  <path d="M150,110 C180,110 215,95 225,90 C220,105 195,125 170,130 Z" />

  <!-- Gapit rod -->
  <path d="M102,260 L102,345 L108,345 L108,260 Z" opacity="0.6"/>

  <!-- Tatahan (carving details) -->
  <g fill="none" stroke="#F5EEDF" stroke-width="1.8" opacity="0.3" stroke-linecap="round">
    <!-- Smiling eye & eyebrow -->
    <path d="M130,55 Q138,50 145,55" />
    <circle cx="138" cy="58" r="1.5" fill="#F5EEDF" />
    
    <!-- Semar's white fang/smile line -->
    <path d="M125,72 Q135,78 145,70" />

    <!-- Sarung Poleng (Checked sarong pattern) -->
    <path d="M70,190 L160,190 M60,215 L170,215 M55,240 L160,240" stroke-dasharray="3 3"/>
    <path d="M85,175 L75,255 M115,170 L110,260 M145,175 L140,250" stroke-dasharray="3 3"/>

    <!-- Ear ornament (anting-anting) -->
    <circle cx="115" cy="70" r="3" />
  </g>
</svg>

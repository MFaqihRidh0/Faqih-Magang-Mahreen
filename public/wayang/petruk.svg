<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 440" fill="none">
  <!-- Petruk Kantong Bolong Silhouette (Solid in currentColor) -->
  <path d="M125,50 
           C130,32 142,24 156,24 
           C160,14 168,12 172,18 
           C168,26 168,36 160,46 
           C172,50 182,60 185,74 
           L255,82 L260,92 L188,98 
           C190,110 182,120 172,124 
           C168,145 174,175 172,225 
           C168,275 162,312 156,335 
           L160,390 L140,390 L140,342 
           L122,342 L122,390 L105,390 L110,335 
           C92,310 92,268 98,220 
           C105,170 110,138 114,115 
           C108,100 114,70 125,50 Z" 
        fill="currentColor" />

  <!-- Long Expressive Slender Arms (Tangan Dawa Petruk) -->
  <path d="M162,145 C202,140 242,172 260,205 C248,212 215,186 170,172 Z" fill="currentColor" />
  <path d="M106,155 C80,180 75,225 90,265 C100,258 98,220 115,188 Z" fill="currentColor" />

  <!-- Gapit Central Rod (Tangkai Wayang) -->
  <rect x="131" y="325" width="10" height="110" rx="3" fill="#7E6337" opacity="0.85" />

  <!-- Ornate Tatahan Carving Details -->
  <g stroke="#171412" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    
    <!-- Petruk's Distinctive Long Pointed Nose (Irung Mancung Dawa) -->
    <path d="M165,72 L254,82" stroke-width="2.8" />
    <path d="M254,82 L258,88 L188,98" stroke-width="2.5" />

    <!-- Bright, Jovial Eye & Brow -->
    <circle cx="155" cy="65" r="3.5" stroke-width="2" fill="#171412" />
    <path d="M145,56 Q158,50 170,56" stroke-width="2" />

    <!-- Wide Signature Laugh / Grin -->
    <path d="M152,104 Q168,116 182,100" stroke-width="2.5" />
    <path d="M158,106 Q168,110 176,106" stroke-width="1.5" />

    <!-- Sumping Ear Ornament & Hair Knot (Kuncung mburi) -->
    <circle cx="132" cy="85" r="4.5" stroke-width="2" />
    <path d="M160,46 Q168,30 172,18" stroke-width="2" />

    <!-- Slender Waist Sash & Belt (Sabuk Cinde) -->
    <path d="M110,225 Q138,238 166,225" stroke-width="2.5" />
    <path d="M108,245 Q138,258 164,245" stroke-width="2" stroke-dasharray="3 3" />
    <rect x="132" y="228" width="12" height="12" rx="2" fill="#171412" stroke-width="1.5" />

    <!-- Kain Batik Pattern on Sarong -->
    <path d="M112,275 Q138,290 160,275" stroke-width="1.8" />
    <path d="M116,305 Q138,320 156,305" stroke-width="1.8" stroke-dasharray="3 3" />

    <!-- Arm & Leg Bangles -->
    <line x1="225" y1="185" x2="242" y2="195" stroke-width="2" />
    <line x1="140" y1="380" x2="160" y2="380" stroke-width="2" />
    <line x1="105" y1="380" x2="122" y2="380" stroke-width="2" />
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 440" fill="none">
  <!-- Nala Gareng Prada Emas Asli (Full Color Traditional Wayang Kulit) -->

  <!-- Gapit Central Rod (Tangkai Tanduk Kerbau Cokelat Keemasan) -->
  <rect x="133" y="295" width="10" height="140" rx="3" fill="#8C6239" stroke="#4A3018" stroke-width="1.5" />
  <rect x="135" y="175" width="6" height="130" rx="2" fill="#5C3D1E" opacity="0.6" />

  <!-- Iconic Bent Arms (Tangan Ceko Gareng) -->
  <path d="M180,140 C212,154 238,146 244,172 C230,186 205,172 180,178 Z" fill="#E8C988" stroke="#1F1B19" stroke-width="2.2" />
  <path d="M115,152 C95,172 90,198 110,205 C122,192 122,172 115,152 Z" fill="#E8C988" stroke="#1F1B19" stroke-width="2.2" />

  <!-- Gareng Golden Body Base -->
  <path d="M150,65 
           C150,45 162,35 175,35 
           C180,25 186,18 194,22 
           C188,32 190,44 182,52 
           C195,58 208,68 214,84 
           C224,86 228,96 220,105 
           C212,108 202,104 195,108 
           C192,130 210,165 210,210 
           C210,255 190,292 172,310 
           L172,355 L146,355 L146,316 
           L120,316 L120,348 L100,348 L100,310 
           C80,290 80,240 86,200 
           C92,155 112,118 138,98 
           C132,85 135,70 150,65 Z" 
        fill="#E8C988" 
        stroke="#1F1B19" 
        stroke-width="2.5" />

  <!-- Hair Knot (Kuncung mburi) in Black with Gold Band -->
  <path d="M182,52 Q190,36 194,22 C186,18 180,25 175,35 Z" fill="#1F1B19" stroke="#1F1B19" stroke-width="1.5" />
  <rect x="176" y="38" width="10" height="4" rx="1.5" fill="#E5C477" stroke="#1F1B19" stroke-width="1" />

  <!-- Sumping (Golden Ear Ornament) with Ruby Center -->
  <circle cx="148" cy="96" r="6" fill="#C9A96E" stroke="#1F1B19" stroke-width="1.8" />
  <circle cx="148" cy="96" r="3" fill="#B83232" />

  <!-- Lower Garment / Kain Batik Parang (Golden Yellow & Warm Ochre) -->
  <g>
    <path d="M96,220 C96,270 115,310 146,316 L172,310 C195,280 205,245 205,220 Z" fill="#D6BC8A" stroke="#1F1B19" stroke-width="2" />
    <!-- Diagonal Parang Stripes in Red & Dark Charcoal -->
    <path d="M110,230 L135,255 M145,230 L170,255 M115,260 L140,285 M150,260 L175,285 M120,290 L145,315" stroke="#B83232" stroke-width="3" />
    <path d="M115,230 L140,255 M150,230 L175,255 M120,260 L145,285 M155,260 L180,285" stroke="#1F1B19" stroke-width="1.5" stroke-dasharray="2 3" />
    
    <!-- Red Hanging Silk Sash (Sampur) -->
    <path d="M142,220 Q145,265 148,316 L156,316 Q153,265 150,220 Z" fill="#B83232" stroke="#1F1B19" stroke-width="1.5" />
  </g>

  <!-- Golden Waistband (Sabuk Emas) & Buckle -->
  <path d="M100,220 Q146,236 195,220" stroke="#C9A96E" stroke-width="7" fill="none" />
  <path d="M100,220 Q146,236 195,220" stroke="#1F1B19" stroke-width="1.8" fill="none" />
  <rect x="140" y="222" width="14" height="12" rx="2" fill="#E5C477" stroke="#1F1B19" stroke-width="1.5" />
  <circle cx="147" cy="228" r="2.5" fill="#B83232" />

  <!-- Gareng Face Features: Round Button Nose, Cross-eyes, Cheerful Grin -->
  <g>
    <!-- Round Button Nose (Irung Bunder) with Red highlight -->
    <ellipse cx="204" cy="94" rx="8.5" ry="7.5" fill="#E8C988" stroke="#1F1B19" stroke-width="2.2" />
    <circle cx="206" cy="94" r="3" fill="#B83232" opacity="0.6" />

    <!-- Cross-eyed gaze (Mata Kero) with White Sclera and Black Pupil -->
    <ellipse cx="178" cy="80" rx="5" ry="4" fill="#FFFFFF" stroke="#1F1B19" stroke-width="1.5" />
    <circle cx="178" cy="80" r="2.5" fill="#1F1B19" />
    <ellipse cx="168" cy="82" rx="4.5" ry="3.5" fill="#FFFFFF" stroke="#1F1B19" stroke-width="1.5" />
    <circle cx="168" cy="82" r="2" fill="#1F1B19" />
    <path d="M164,70 Q178,63 192,70" stroke="#1F1B19" stroke-width="2.2" stroke-linecap="round" fill="none" />

    <!-- Cheerful Grin with Ruby Lip fill -->
    <path d="M172,108 Q188,118 202,106" stroke="#1F1B19" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M176,108 Q188,114 198,107" fill="#B83232" />
  </g>

  <!-- Arm & Ankle Bangles (Gelang & Binggel Emas) -->
  <rect x="212" y="156" width="16" height="6" rx="1.5" fill="#C9A96E" stroke="#1F1B19" stroke-width="1.2" />
  <rect x="146" y="342" width="26" height="6" rx="1.5" fill="#C9A96E" stroke="#1F1B19" stroke-width="1.2" />
</svg>

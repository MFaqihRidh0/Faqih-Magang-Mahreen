<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" fill="none">
  <!-- Gunungan Kayonan Prada Emas Asli (Full Color Traditional Wayang Kulit) -->

  <defs>
    <!-- Gold Gradient for Radiant Leaf Body -->
    <linearGradient id="gununganGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#F5EEDF" />
      <stop offset="35%" stopColor="#E5C477" />
      <stop offset="70%" stopColor="#C9A96E" />
      <stop offset="100%" stopColor="#9E7B3B" />
    </linearGradient>

    <!-- Red Temple Door Gradient -->
    <linearGradient id="doorRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#D94343" />
      <stop offset="100%" stopColor="#8A1E1E" />
    </linearGradient>
  </defs>

  <!-- Gapit Central Rod (Tangkai Tanduk Kerbau Cokelat Keemasan) -->
  <rect x="193" y="460" width="14" height="135" rx="4" fill="#8C6239" stroke="#4A3018" stroke-width="2" />
  <rect x="195" y="180" width="10" height="285" rx="3" fill="#5C3D1E" opacity="0.65" />

  <!-- Outer Kayon / Gunungan Leaf Silhouette (Solid Golden Body with Rich Stroke) -->
  <path d="M200,20 
           C240,90 340,210 350,340 
           C355,420 320,470 280,485 
           L280,510 L120,510 L120,485 
           C80,470 45,420 50,340 
           C60,210 160,90 200,20 Z" 
        fill="url(#gununganGold)" 
        stroke="#1F1B19" 
        stroke-width="3" />

  <!-- Inner Ornate Decorative Border Band -->
  <path d="M200,35 C235,95 325,210 335,335 C340,405 310,455 270,470 L130,470 C90,455 60,405 65,335 C75,210 165,95 200,35 Z" 
        stroke="#8A1E1E" 
        stroke-width="3.5" 
        stroke-dasharray="6 3" 
        fill="none" />
  <path d="M200,42 C230,100 318,212 328,332 C332,398 305,446 266,460 L134,460 C95,446 68,398 72,332 C82,212 170,100 200,42 Z" 
        stroke="#1F1B19" 
        stroke-width="1.8" 
        fill="none" />

  <!-- GAPURA AGUNG (Sacred Central Temple Gate at Base) -->
  <g>
    <!-- Base Platform & Stepped Plinth in Stone & Gold -->
    <rect x="140" y="445" width="120" height="22" rx="3" fill="#D6BC8A" stroke="#1F1B19" stroke-width="2.5" />
    <rect x="148" y="435" width="104" height="12" rx="2" fill="#E5C477" stroke="#1F1B19" stroke-width="2" />
    <line x1="135" y1="467" x2="265" y2="467" stroke="#1F1B19" stroke-width="3.5" />

    <!-- Gate Pillars (Tiang Candi Emas) -->
    <rect x="155" y="340" width="22" height="95" fill="#E5C477" stroke="#1F1B19" stroke-width="2.5" />
    <rect x="223" y="340" width="22" height="95" fill="#E5C477" stroke="#1F1B19" stroke-width="2.5" />
    <!-- Pillar Carved Details -->
    <line x1="150" y1="350" x2="182" y2="350" stroke="#8A1E1E" stroke-width="3" />
    <line x1="218" y1="350" x2="250" y2="350" stroke="#8A1E1E" stroke-width="3" />
    <line x1="150" y1="428" x2="182" y2="428" stroke="#8A1E1E" stroke-width="3" />
    <line x1="218" y1="428" x2="250" y2="428" stroke="#8A1E1E" stroke-width="3" />

    <!-- Double Red Temple Doors (Lawang Genthong Abang) -->
    <path d="M177,435 L177,360 Q188,348 200,348 Q212,348 223,360 L223,435 Z" fill="url(#doorRed)" stroke="#1F1B19" stroke-width="2.5" />
    <line x1="200" y1="348" x2="200" y2="435" stroke="#E5C477" stroke-width="2.5" />
    <!-- Golden Door Knobs -->
    <circle cx="193" cy="395" r="3.5" fill="#F5EEDF" stroke="#1F1B19" stroke-width="1.2" />
    <circle cx="207" cy="395" r="3.5" fill="#F5EEDF" stroke="#1F1B19" stroke-width="1.2" />

    <!-- KALA MASK (Batara Kala di Puncak Gapura) -->
    <path d="M165,340 Q200,305 235,340 Z" fill="#8A1E1E" stroke="#1F1B19" stroke-width="2.5" />
    <circle cx="185" cy="328" r="5" fill="#FFFFFF" stroke="#1F1B19" stroke-width="1.5" />
    <circle cx="185" cy="328" r="2.5" fill="#1F1B19" />
    <circle cx="215" cy="328" r="5" fill="#FFFFFF" stroke="#1F1B19" stroke-width="1.5" />
    <circle cx="215" cy="328" r="2.5" fill="#1F1B19" />
    <path d="M175,338 Q200,345 225,338" stroke="#FFFFFF" stroke-width="2.5" fill="none" />
  </g>

  <!-- POHON HAYAT / KALPATARU (Tree of Life Spreading Branches) -->
  <g stroke="#1F1B19" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Main Tree Trunk -->
    <path d="M200,435 L200,105" stroke-width="5" stroke="#5C3D1E" />
    <path d="M192,435 L192,260 M208,435 L208,260" stroke-width="2" stroke="#8C6239" />

    <!-- Spreading Branches with Leaf Clusters -->
    <!-- Tier 1 -->
    <path d="M200,280 C240,255 285,275 305,315" stroke-width="3.5" stroke="#1F1B19" />
    <path d="M200,280 C160,255 115,275 95,315" stroke-width="3.5" stroke="#1F1B19" />
    <circle cx="305" cy="315" r="9" fill="#8A1E1E" stroke="#1F1B19" stroke-width="2" />
    <circle cx="305" cy="315" r="4.5" fill="#F5EEDF" />
    <circle cx="95" cy="315" r="9" fill="#8A1E1E" stroke="#1F1B19" stroke-width="2" />
    <circle cx="95" cy="315" r="4.5" fill="#F5EEDF" />

    <!-- Tier 2 -->
    <path d="M200,215 C235,180 275,195 295,235" stroke-width="3" stroke="#1F1B19" />
    <path d="M200,215 C165,180 125,195 105,235" stroke-width="3" stroke="#1F1B19" />
    <circle cx="295" cy="235" r="8" fill="#8A1E1E" stroke="#1F1B19" stroke-width="2" />
    <circle cx="295" cy="235" r="4" fill="#F5EEDF" />
    <circle cx="105" cy="235" r="8" fill="#8A1E1E" stroke="#1F1B19" stroke-width="2" />
    <circle cx="105" cy="235" r="4" fill="#F5EEDF" />

    <!-- Tier 3 Upper Canopy -->
    <path d="M200,155 C225,120 255,130 270,165" stroke-width="2.5" stroke="#1F1B19" />
    <path d="M200,155 C175,120 145,130 130,165" stroke-width="2.5" stroke="#1F1B19" />
    <circle cx="270" cy="165" r="7" fill="#8A1E1E" stroke="#1F1B19" stroke-width="1.8" />
    <circle cx="270" cy="165" r="3.5" fill="#F5EEDF" />
    <circle cx="130" cy="165" r="7" fill="#8A1E1E" stroke="#1F1B19" stroke-width="1.8" />
    <circle cx="130" cy="165" r="3.5" fill="#F5EEDF" />

    <!-- GARUDA WINGS (Sayap Lar) in Red and Gold -->
    <path d="M110,380 C75,360 80,325 105,305 C90,300 80,280 110,265" stroke-width="2.8" stroke="#8A1E1E" />
    <path d="M290,380 C325,360 320,325 295,305 C310,300 320,280 290,265" stroke-width="2.8" stroke="#8A1E1E" />

    <!-- Sacred Crown Flame Peak (Lidah Api Emas Puncak) -->
    <path d="M200,20 C194,50 185,75 200,95 C215,75 206,50 200,20 Z" fill="#8A1E1E" stroke="#1F1B19" stroke-width="2" />
    <circle cx="200" cy="65" r="4.5" fill="#F5EEDF" stroke="#1F1B19" stroke-width="1.2" />
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 440" fill="none">
  <!-- Bagong Silhouette Body (Solid in currentColor) -->
  <path d="M140,80 
           C140,55 152,42 165,42 
           C172,30 176,24 185,26 
           C180,36 180,46 175,55 
           C190,62 205,74 208,94 
           C222,100 230,118 222,135 
           C212,140 202,138 192,140 
           C195,170 220,200 220,250 
           C220,305 182,345 145,350 
           L145,385 L120,385 L120,348 
           C70,342 55,298 55,235 
           C55,175 92,125 125,106 
           C122,94 125,84 140,80 Z" 
        fill="currentColor" />

  <!-- Expressive Gesturing Hands (Tangan Lucu Bagong) -->
  <path d="M190,160 C228,172 260,160 272,178 C260,198 228,192 192,185 Z" fill="currentColor" />
  <path d="M95,168 C70,186 64,218 80,235 C92,230 96,205 108,186 Z" fill="currentColor" />

  <!-- Gapit Central Rod (Tangkai Wayang) -->
  <rect x="128" y="335" width="10" height="100" rx="3" fill="#7E6337" opacity="0.85" />

  <!-- Ornate Tatahan Carving Details -->
  <g stroke="#171412" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    
    <!-- Bagong's Big Bulging Eye (Mripat Thelengan) -->
    <circle cx="178" cy="82" r="9" stroke-width="2.5" />
    <circle cx="178" cy="82" r="4.5" fill="#171412" stroke-width="1" />
    <circle cx="180" cy="80" r="1.5" fill="#F5EEDF" />
    <path d="M165,70 Q178,64 192,70" stroke-width="2.2" />

    <!-- Wide Open Grinning Mouth (Cangkem Ngablak) -->
    <path d="M168,112 Q194,134 212,110" stroke-width="2.8" />
    <path d="M172,116 L206,116" stroke-width="1.8" stroke-dasharray="3 2" />

    <!-- Chubby Cheek & Sumping -->
    <circle cx="145" cy="100" r="5" stroke-width="2" />
    <path d="M175,55 Q182,38 185,26" stroke-width="2" />

    <!-- Stately Rounded Belly Bands & Girdle (Sabuk & Otok) -->
    <path d="M80,255 Q145,280 195,255" stroke-width="2.5" />
    <path d="M84,275 Q145,300 190,275" stroke-width="2" stroke-dasharray="3 3" />
    <circle cx="140" cy="240" r="2.5" fill="#171412" />

    <!-- Lower Cloth / Sarong Motif -->
    <path d="M92,305 Q145,325 178,305" stroke-width="1.8" />
    <path d="M102,328 Q145,342 165,328" stroke-width="1.8" stroke-dasharray="3 3" />

    <!-- Foot Bangles -->
    <line x1="120" y1="375" x2="145" y2="375" stroke-width="2" />
  </g>
</svg>

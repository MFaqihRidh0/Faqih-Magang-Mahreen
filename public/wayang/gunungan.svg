<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" fill="none">
  <!-- Outer Kayon / Gunungan Leaf Silhouette (Solid Golden Body) -->
  <path d="M200,20 
           C240,90 340,210 350,340 
           C355,420 320,470 280,485 
           L280,510 L120,510 L120,485 
           C80,470 45,420 50,340 
           C60,210 160,90 200,20 Z" 
        fill="currentColor" />

  <!-- Gapit Central Rod (Tangkai Wayang Kulit) -->
  <rect x="194" y="470" width="12" height="120" rx="4" fill="#7E6337" opacity="0.85" />
  <rect x="196" y="200" width="8" height="270" rx="3" fill="#171412" opacity="0.35" />

  <!-- Ornate Tatahan (Cutout filigree carving in contrasting dark charcoal / negative space) -->
  <g stroke="#171412" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    
    <!-- Outer Border Filigree (Pinggiran Ukir) -->
    <path d="M200,35 C235,95 325,210 335,335 C340,405 310,455 270,470 L130,470 C90,455 60,405 65,335 C75,210 165,95 200,35 Z" stroke-width="1.8" stroke-dasharray="6 4" />

    <!-- POHON HAYAT (Tree of Life Central Trunk) -->
    <path d="M200,470 L200,120" stroke-width="4.5" />
    <path d="M192,470 L192,260 M208,470 L208,260" stroke-width="2" />

    <!-- GAPURA AGUNG (Sacred Central Temple Gate at Base) -->
    <!-- Base Platform & Steps -->
    <rect x="145" y="440" width="110" height="25" rx="3" fill="#171412" fill-opacity="0.25" stroke-width="2" />
    <line x1="140" y1="465" x2="260" y2="465" stroke-width="3" />
    <line x1="150" y1="452" x2="250" y2="452" stroke-width="1.5" />

    <!-- Gate Pillars -->
    <rect x="155" y="340" width="22" height="100" fill="#171412" fill-opacity="0.2" stroke-width="2.5" />
    <rect x="223" y="340" width="22" height="100" fill="#171412" fill-opacity="0.2" stroke-width="2.5" />
    
    <!-- Pillar capital & base moldings -->
    <line x1="150" y1="350" x2="182" y2="350" stroke-width="3" />
    <line x1="218" y1="350" x2="250" y2="350" stroke-width="3" />
    <line x1="150" y1="435" x2="182" y2="435" stroke-width="3" />
    <line x1="218" y1="435" x2="250" y2="435" stroke-width="3" />

    <!-- Gate Doors (Pintu Lawang Genthong) -->
    <path d="M177,440 L177,360 Q188,350 200,350 Q212,350 223,360 L223,440 Z" fill="#171412" fill-opacity="0.35" stroke-width="2.5" />
    <line x1="200" y1="350" x2="200" y2="440" stroke-width="2" />

    <!-- KALA / KIRTAMUKHA (Guardian Mask atop Gate) -->
    <path d="M165,340 Q200,310 235,340 Z" fill="#171412" fill-opacity="0.4" stroke-width="2.5" />
    <circle cx="185" cy="330" r="4.5" fill="#171412" />
    <circle cx="215" cy="330" r="4.5" fill="#171412" />
    <path d="M175,340 Q200,346 225,340" stroke-width="2" />

    <!-- BRANCHES SPREADING OUTWARD (Ranting & Dahan Pohon Hayat) -->
    <!-- Tier 1 Branches -->
    <path d="M200,280 C240,260 285,280 305,320" stroke-width="3" />
    <path d="M200,280 C160,260 115,280 95,320" stroke-width="3" />
    <path d="M255,273 C275,250 310,260 325,290" stroke-width="2" />
    <path d="M145,273 C125,250 90,260 75,290" stroke-width="2" />

    <!-- Tier 2 Branches -->
    <path d="M200,220 C235,185 275,200 295,240" stroke-width="2.8" />
    <path d="M200,220 C165,185 125,200 105,240" stroke-width="2.8" />
    <path d="M240,200 C265,170 290,185 300,215" stroke-width="1.8" />
    <path d="M160,200 C135,170 110,185 100,215" stroke-width="1.8" />

    <!-- Tier 3 Upper Canopy Branches -->
    <path d="M200,165 C225,130 255,140 270,175" stroke-width="2.2" />
    <path d="M200,165 C175,130 145,140 130,175" stroke-width="2.2" />
    <path d="M200,120 C215,90 235,95 245,125" stroke-width="2" />
    <path d="M200,120 C185,90 165,95 155,125" stroke-width="2" />

    <!-- GARUDA WINGS / SAYAP LAR (Side Wing Motifs) -->
    <path d="M110,380 C80,360 85,325 110,305 C95,300 85,280 115,265" stroke-width="2" />
    <path d="M290,380 C320,360 315,325 290,305 C305,300 315,280 285,265" stroke-width="2" />

    <!-- INTRICATE TATAHAN FOLIAGE & SACRED BLOSSOMS (Titik & Bunga Tatahan) -->
    <!-- Blossoms left & right -->
    <circle cx="305" cy="320" r="7" fill="#171412" fill-opacity="0.3" stroke-width="2" />
    <circle cx="95" cy="320" r="7" fill="#171412" fill-opacity="0.3" stroke-width="2" />
    <circle cx="295" cy="240" r="6" fill="#171412" fill-opacity="0.3" stroke-width="2" />
    <circle cx="105" cy="240" r="6" fill="#171412" fill-opacity="0.3" stroke-width="2" />
    <circle cx="270" cy="175" r="5" fill="#171412" fill-opacity="0.3" stroke-width="1.8" />
    <circle cx="130" cy="175" r="5" fill="#171412" fill-opacity="0.3" stroke-width="1.8" />
    <circle cx="245" cy="125" r="4.5" fill="#171412" fill-opacity="0.3" stroke-width="1.8" />
    <circle cx="155" cy="125" r="4.5" fill="#171412" fill-opacity="0.3" stroke-width="1.8" />

    <!-- Sacred Pinnacle Flame (Lidah Api Puncak Gunungan) -->
    <path d="M200,20 C195,50 185,75 200,95 C215,75 205,50 200,20 Z" fill="#171412" fill-opacity="0.35" stroke-width="2" />
    <circle cx="200" cy="70" r="3.5" fill="#171412" />
  </g>
</svg>
